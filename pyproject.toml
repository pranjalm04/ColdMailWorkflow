[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cold-mail-workflow"
version = "0.1.0"
description = "Cold-emailing workflow for job outreach to recruiters."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openpyxl>=3.1.0",
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["src"]
